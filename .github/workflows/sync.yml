name: Sync container images to Alibaba Cloud ACR

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: "Target Linux architecture"
        required: true
        type: choice
        default: amd64
        options:
          - amd64
          - arm64

permissions:
  contents: read

concurrency:
  group: dockerhub2aliyun-sync
  cancel-in-progress: false

jobs:
  prepare:
    name: Read image list
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image matrix
        id: list
        shell: bash
        run: |
          set -Eeuo pipefail
          images="$(jq -Rsc 'split("\n") | map(select(length > 0 and (startswith("#") | not)))' images.txt)"
          if [[ "$images" == "[]" ]]; then
            echo "::error::images.txt contains no images."
            exit 1
          fi
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "Prepared $(jq 'length' <<< "$images") image jobs."

  sync:
    name: "Sync ${{ matrix.image }} (${{ inputs.architecture }})"
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        image: ${{ fromJSON(needs.prepare.outputs.images) }}
    steps:
      - name: Ensure Skopeo is installed
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes skopeo
          fi
          skopeo --version

      - name: Copy selected platform to ACR
        shell: bash
        env:
          SOURCE_IMAGE: ${{ matrix.image }}
          TARGET_ARCH: ${{ inputs.architecture }}
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          # Optional: set both to reduce Docker Hub anonymous pull limits.
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          for name in ACR_REGISTRY ACR_NAMESPACE ACR_USERNAME ACR_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Secret: ${name}"
              exit 1
            fi
          done

          case "$TARGET_ARCH" in
            amd64|arm64) ;;
            *)
              echo "::error::Unsupported target architecture: $TARGET_ARCH"
              exit 1
              ;;
          esac

          ACR_REGISTRY="${ACR_REGISTRY#https://}"
          ACR_REGISTRY="${ACR_REGISTRY#http://}"
          ACR_REGISTRY="${ACR_REGISTRY%/}"

          AUTH_FILE="${RUNNER_TEMP}/skopeo-auth.json"
          trap 'rm -f "$AUTH_FILE"' EXIT

          printf '%s' "$ACR_PASSWORD" |
            skopeo login --authfile "$AUTH_FILE" \
              --username "$ACR_USERNAME" --password-stdin "$ACR_REGISTRY"

          if [[ -n "${DOCKERHUB_USERNAME:-}" && -n "${DOCKERHUB_TOKEN:-}" ]]; then
            printf '%s' "$DOCKERHUB_TOKEN" |
              skopeo login --authfile "$AUTH_FILE" \
                --username "$DOCKERHUB_USERNAME" --password-stdin docker.io
          fi

          image="$SOURCE_IMAGE"
          first_component="${image%%/*}"
          if [[ "$image" == */* && ( "$first_component" == *.* || "$first_component" == *:* || "$first_component" == "localhost" ) ]]; then
            source_registry="$first_component"
            source_path="${image#*/}"
          else
            source_registry="docker.io"
            source_path="$image"
          fi

          last_component="${source_path##*/}"
          if [[ "$last_component" == *:* ]]; then
            tag="${last_component##*:}"
            source_path_no_tag="${source_path%:*}"
          else
            tag="latest"
            source_path_no_tag="$source_path"
          fi

          # ACR Personal Edition repositories are single-level; flatten paths.
          case "$source_registry" in
            docker.io) source_prefix="dockerhub" ;;
            ghcr.io) source_prefix="ghcr-io" ;;
            *)
              source_prefix="${source_registry//./-}"
              source_prefix="${source_prefix//:/-}"
              ;;
          esac

          repo_component="$(printf '%s' "$source_path_no_tag" | tr '/' '-')"
          repo_name="${source_prefix}-${repo_component}"
          repo_name="$(printf '%s' "$repo_name" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"

          if (( ${#repo_name} < 2 || ${#repo_name} > 64 )); then
            echo "::error::Generated ACR repository name is outside the 2-64 character limit: $repo_name"
            exit 1
          fi

          destination="docker://${ACR_REGISTRY}/${ACR_NAMESPACE}/${repo_name}:${tag}"
          echo "Source: $image"
          echo "Destination: ${destination#docker://}"
          echo "Platform: linux/$TARGET_ARCH"
          echo "Copy mode: one platform only; Docker V2 Schema 2 manifest"

          # Do not use --all: ACR Personal Edition rejects some auxiliary
          # OCI manifests included in multi-architecture indexes.
          skopeo --override-os linux --override-arch "$TARGET_ARCH" copy \
            --format v2s2 --retry-times 2 --authfile "$AUTH_FILE" \
            "docker://$image" "$destination"

          {
            echo "## Image sync succeeded"
            echo
            echo "- Source: `$image`"
            echo "- Destination: `${ACR_REGISTRY}/${ACR_NAMESPACE}/${repo_name}:${tag}`"
            echo "- Platform: `linux/$TARGET_ARCH`"
          } >> "$GITHUB_STEP_SUMMARY"
