name: Sync container images to Alibaba Cloud ACR

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: "Target Linux architecture"
        required: true
        type: choice
        default: amd64
        options:
          - amd64
          - arm64

permissions:
  contents: read

concurrency:
  group: dockerhub2aliyun-sync
  cancel-in-progress: false

jobs:
  prepare:
    name: Read image list and resolve repository names
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image matrix
        id: list
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          import json
          import re
          from collections import defaultdict
          from pathlib import Path

          def clean(value):
              return re.sub(r"[^a-z0-9._-]+", "-", value.lower()).strip("-._")

          def parse_image(image):
              first, sep, rest = image.partition("/")
              if sep and ("." in first or ":" in first or first == "localhost"):
                  registry, source_path = first.lower(), rest
              else:
                  registry, source_path = "docker.io", image

              last = source_path.rsplit("/", 1)[-1]
              if ":" in last:
                  source_path = source_path.rsplit(":", 1)[0] if "/" not in source_path else source_path[:-(len(last))] + last.rsplit(":", 1)[0]
              source_path = source_path.strip("/")
              if not source_path:
                  raise ValueError(f"Invalid image reference: {image}")
              key = f"{registry}/{source_path}".lower()
              parts = source_path.lower().split("/")
              registry_label = "dockerhub" if registry == "docker.io" else clean(registry.replace(".", "-").replace(":", "-"))
              return key, parts, registry_label

          images = []
          for raw in Path("images.txt").read_text(encoding="utf-8").splitlines():
              image = raw.strip()
              if not image or image.startswith("#"):
                  continue
              key, parts, registry_label = parse_image(image)
              images.append({"image": image, "key": key})

          if not images:
              raise SystemExit("images.txt contains no images.")

          # Resolve names by starting with the final path component. Only
          # colliding repositories gain one more parent component at a time.
          repos = {}
          for item in images:
              key = item["key"]
              if key not in repos:
                  _, parts, registry_label = parse_image(item["image"])
                  repos[key] = {"parts": parts, "registry": registry_label, "depth": 1}

          def make_name(info):
              parts = info["parts"]
              depth = info["depth"]
              if depth <= len(parts):
                  pieces = parts[-depth:]
              else:
                  pieces = [info["registry"]] + parts
              return clean("-".join(pieces)) or "image"

          for _ in range(100):
              by_name = defaultdict(list)
              for key, info in repos.items():
                  by_name[make_name(info)].append(key)
              collisions = [keys for keys in by_name.values() if len(keys) > 1]
              if not collisions:
                  break
              changed = False
              for keys in collisions:
                  for key in keys:
                      info = repos[key]
                      if info["depth"] <= len(info["parts"]):
                          info["depth"] += 1
                          changed = True
              if not changed:
                  # Extremely rare sanitization/registry collisions: deterministic
                  # suffix as a final guard, after exhausting parent path names.
                  for keys in collisions:
                      for key in keys:
                          info = repos[key]
                          base = make_name(info)
                          info["final"] = f"{base[:54].rstrip('-._')}-{hashlib.sha256(key.encode()).hexdigest()[:8]}"
                  break

          for key, info in repos.items():
              name = info.get("final", make_name(info))
              if len(name) > 64:
                  name = f"{name[:55].rstrip('-._')}-{hashlib.sha256(key.encode()).hexdigest()[:8]}"
              info["final"] = name

          # Ensure truncation did not introduce a collision.
          final_groups = defaultdict(list)
          for key, info in repos.items():
              final_groups[info["final"]].append(key)
          for name, keys in final_groups.items():
              if len(keys) > 1:
                  for key in keys:
                      info = repos[key]
                      info["final"] = f"{name[:54].rstrip('-._')}-{hashlib.sha256(key.encode()).hexdigest()[:8]}"

          matrix = [
              {"image": item["image"], "repo_name": repos[item["key"]]["final"]}
              for item in images
          ]
          print("images=" + json.dumps(matrix, separators=(",", ":")))
          PY

  sync:
    name: "Sync ${{ matrix.image }} -> ${{ matrix.repo_name }} (${{ inputs.architecture }})"
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.images) }}
    steps:
      - name: Ensure Skopeo is installed
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes skopeo
          fi
          skopeo --version

      - name: Copy selected platform to ACR
        shell: bash
        env:
          SOURCE_IMAGE: ${{ matrix.image }}
          TARGET_REPO: ${{ matrix.repo_name }}
          TARGET_ARCH: ${{ inputs.architecture }}
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          # Optional: set both to reduce Docker Hub anonymous pull limits.
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          for name in ACR_REGISTRY ACR_NAMESPACE ACR_USERNAME ACR_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Secret: ${name}"
              exit 1
            fi
          done

          case "$TARGET_ARCH" in
            amd64|arm64) ;;
            *)
              echo "::error::Unsupported target architecture: $TARGET_ARCH"
              exit 1
              ;;
          esac

          ACR_REGISTRY="${ACR_REGISTRY#https://}"
          ACR_REGISTRY="${ACR_REGISTRY#http://}"
          ACR_REGISTRY="${ACR_REGISTRY%/}"

          AUTH_FILE="${RUNNER_TEMP}/skopeo-auth.json"
          trap 'rm -f "$AUTH_FILE"' EXIT

          printf '%s' "$ACR_PASSWORD" |
            skopeo login --authfile "$AUTH_FILE" \
              --username "$ACR_USERNAME" --password-stdin "$ACR_REGISTRY"

          if [[ -n "${DOCKERHUB_USERNAME:-}" && -n "${DOCKERHUB_TOKEN:-}" ]]; then
            printf '%s' "$DOCKERHUB_TOKEN" |
              skopeo login --authfile "$AUTH_FILE" \
                --username "$DOCKERHUB_USERNAME" --password-stdin docker.io
          fi

          image="$SOURCE_IMAGE"
          last_component="${image##*/}"
          if [[ "$last_component" == *:* ]]; then
            tag="${last_component##*:}"
          else
            tag="latest"
          fi

          repo_name="$TARGET_REPO"
          if (( ${#repo_name} < 2 || ${#repo_name} > 64 )); then
            echo "::error::Generated ACR repository name is outside the 2-64 character limit: $repo_name"
            exit 1
          fi

          destination="docker://${ACR_REGISTRY}/${ACR_NAMESPACE}/${repo_name}:${tag}"
          echo "Source: $image"
          echo "Destination: ${destination#docker://}"
          echo "Platform: linux/$TARGET_ARCH"
          echo "Copy mode: one platform only; Docker V2 Schema 2 manifest"

          # Do not use --all: ACR Personal Edition rejects some auxiliary
          # OCI manifests included in multi-architecture indexes.
          skopeo --override-os linux --override-arch "$TARGET_ARCH" copy \
            --format v2s2 --retry-times 2 --authfile "$AUTH_FILE" \
            "docker://$image" "$destination"

          {
            echo "## Image sync succeeded"
            echo
            echo "- Source: $image"
            echo "- Destination: ${ACR_REGISTRY}/${ACR_NAMESPACE}/${repo_name}:${tag}"
            echo "- Platform: linux/$TARGET_ARCH"
          } >> "$GITHUB_STEP_SUMMARY"
